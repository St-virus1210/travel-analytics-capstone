services:
  mlflow:
    image: python:3.11-slim
    working_dir: /mlflow
    command: >-
      sh -c "pip install --no-cache-dir 'mlflow>=2.10,<4.0' && mlflow server --host 0.0.0.0 --port 5000 --backend-store-uri sqlite:////mlflow/mlflow.db --serve-artifacts --artifacts-destination /mlflow/artifacts"
    ports: ["5001:5000"]
    volumes: [mlflow_data:/mlflow]
    healthcheck:
      test: ["CMD","python","-c","import urllib.request; urllib.request.urlopen('http://localhost:5000/health')"]
      interval: 20s
      timeout: 5s
      retries: 10
      start_period: 60s
  api:
    build: .
    image: travel-analytics-api:local
    ports: ["5000:5000"]
    environment:
      MODEL_DIR: /app/artifacts
      DATA_DIR: /app/data
      MLFLOW_TRACKING_URI: http://mlflow:5000
    volumes:
      - ./artifacts:/app/artifacts
      - ./data:/app/data:ro
    depends_on:
      mlflow:
        condition: service_healthy
    healthcheck:
      test: ["CMD","python","-c","import urllib.request; urllib.request.urlopen('http://localhost:5000/health')"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
  dashboard:
    build: .
    image: travel-analytics-dashboard:local
    entrypoint: ["streamlit"]
    command: ["run","streamlit/app.py","--server.address=0.0.0.0","--server.port=8501"]
    ports: ["8501:8501"]
    environment:
      DATA_DIR: /app/data
      API_URL: http://api:5000
    depends_on:
      api:
        condition: service_healthy
volumes:
  mlflow_data:
