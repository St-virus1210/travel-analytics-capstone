apiVersion: apps/v1
kind: Deployment
metadata:
  name: travel-analytics-api
spec:
  replicas: 2
  selector:
    matchLabels: {app: travel-analytics-api}
  template:
    metadata:
      labels: {app: travel-analytics-api}
    spec:
      containers:
      - name: api
        image: travel-analytics-api:local
        imagePullPolicy: IfNotPresent
        ports: [{containerPort: 5000}]
        env:
        - {name: MODEL_DIR, value: /app/artifacts}
        - {name: DATA_DIR, value: /app/data}
        readinessProbe:
          httpGet: {path: /health, port: 5000}
          initialDelaySeconds: 10
          periodSeconds: 10
        livenessProbe:
          httpGet: {path: /health, port: 5000}
          initialDelaySeconds: 20
          periodSeconds: 20
        resources:
          requests: {cpu: "250m", memory: "512Mi"}
          limits: {cpu: "1", memory: "2Gi"}
